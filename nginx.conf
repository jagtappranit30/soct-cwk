# =====================================================================
# Nginx config for the nottsEvents Frontend
# =====================================================================
#
# Serves static HTML/CSS/JS from /usr/share/nginx/html
# and proxies all /api/* requests to the backend container.
#
# This means the frontend JavaScript can always just use /api/... 
# as the base URL — Nginx handles routing to the correct service.
# =====================================================================

server {
    listen 8080;

    # Serve static frontend files
    root /usr/share/nginx/html;
    index index.html;

    # Handle all frontend page navigation (SPA-style fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy all API calls to the Spring Boot backend
    location /api/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # "backend" is the Docker Compose service name — Docker DNS resolves it
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Allow CORS headers to pass through to the browser
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }
}
