<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Notts Event Booking System</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light">

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🎓 NottsEvents</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-links">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="search.html">Search</a></li>
                    <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Login Section -->
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg border-0 rounded-4 overflow-hidden mt-lg-5">
                    <div class="card-header bg-dark text-white text-center py-4">
                        <div class="fs-1 mb-2">👤</div>
                        <h3 class="fw-bold mb-0">Student Login</h3>
                    </div>
                    <div class="card-body p-4 p-lg-5 bg-white">
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="studentId" class="form-label fw-600 small">STUDENT ID</label>
                                <input type="text" class="form-control form-control-lg" id="studentId" 
                                       placeholder="e.g. N1278128" required>
                            </div>
                            
                            <div class="mb-4">
                                <label for="password" class="form-label fw-600 small">PASSWORD</label>
                                <input type="password" class="form-control form-control-lg" id="password" 
                                       placeholder="••••••••" required>
                            </div>

                            <div class="d-grid mb-4">
                                <button type="submit" class="btn btn-primary btn-lg py-3 shadow-sm fw-bold" id="login-btn">
                                    Login Now
                                </button>
                            </div>

                            <div class="text-center">
                                <span class="text-muted small">New here?</span>
                                <a href="register.html" class="text-primary fw-600 small text-decoration-none ms-1">Create account</a>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div id="status-message" class="alert mt-4 d-none text-center rounded-4 shadow-sm border-0"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer mt-auto py-5">
        <div class="container text-center">
            <p class="mb-1 text-white">© 2026 Notts Event Booking System</p>
            <p class="small mb-0">SOCT Coursework Demonstration - Built with Vanilla JS</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
